<!doctype html>
<html lang="en-IE">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf5; --surface: #ffffff; --ink: #1f1a17; --ink-2: #3d3530; --muted: #6b6058;
    --line: rgba(31, 26, 23, .12); --grid: rgba(31, 26, 23, .08);
    --accent: #b4500d; --bar: #b4500d; --bar-track: #fbf1e6; --peach: #fbdcc4;
    --error-bg: #fdecea; --error-ink: #8a1c12;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a17; --surface: #2a2420; --ink: #fbf1e6; --ink-2: #e6dacf; --muted: #b3a69b;
      --line: rgba(255, 250, 245, .12); --grid: rgba(255, 250, 245, .08);
      --accent: #f6a868; --bar: #f08a3c; --bar-track: #362e29; --peach: #4a3a30;
      --error-bg: #4a1f1a; --error-ink: #ffd2cc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink-2); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  h1, h2 { color: var(--ink); margin: 0; }
  h2 { font: 700 .78rem/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; border-radius: 50%; }
  .brand h1 { font: 600 1.6rem/1.1 var(--font-display); }
  .brand p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }
  .range { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .range button { font: 600 .88rem var(--font-body); color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .tile .label { font-size: .82rem; color: var(--muted); font-weight: 600; }
  .tile .value { font: 600 2rem/1.15 var(--font-display); color: var(--ink); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .note { font-size: .8rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .grid .card { margin-bottom: 0; }
  .grid + .grid, .grid + .card, .card + .grid { margin-top: 16px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .axis { font: 500 11px var(--font-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--bar); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar, .chart .bar.is-hover { opacity: .75; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .82rem; line-height: 1.4; padding: 7px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; opacity: 0; transition: opacity .1s; }
  .tip strong { display: block; }
  details.table { margin-top: 12px; font-size: .85rem; }
  details.table summary { cursor: pointer; color: var(--muted); }
  details.table table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  details.table th, details.table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  details.table th:first-child, details.table td:first-child { text-align: left; }

  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .bars li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; font-size: .9rem; }
  .bars .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .num { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
  .bars .fill { display: block; height: 100%; border-radius: 3px; background: var(--bar); min-width: 3px; }

  .items { list-style: none; margin: 0; padding: 0; }
  .items li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .items li:first-child { padding-top: 0; }
  .items li:last-child { border-bottom: 0; padding-bottom: 0; }
  .items .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .items .who { color: var(--ink); font-weight: 600; }
  .items .when { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .items .meta { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .items .subject { color: var(--ink-2); font-weight: 500; margin-top: 2px; }
  .items details summary { cursor: pointer; font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .items details p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn { font: 600 .88rem var(--font-body); border-radius: 999px; padding: 9px 16px; text-decoration: none; border: 1px solid var(--ink); color: var(--ink); background: none; cursor: pointer; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn-primary { color: var(--bg); } }

  .empty, .loading { color: var(--muted); font-size: .9rem; }
  .error { background: var(--error-bg); color: var(--error-ink); border-radius: 12px; padding: 12px 14px; font-size: .9rem; margin-bottom: 16px; }
  footer { color: var(--muted); font-size: .82rem; margin-top: 24px; }

  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tiles .tile:last-child { grid-column: 1 / -1; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="https://hands4unity.org/assets/favicon.png" alt="">
      <div><h1>Hands 4 Unity dashboard</h1><p id="who"></p></div>
    </div>
    <div class="range" role="group" aria-label="Time range">
      <button type="button" data-days="7">7 days</button>
      <button type="button" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" data-days="90">90 days</button>
    </div>
  </header>
  <main id="app"><p class="loading">Loading…</p></main>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var days = 30;
  var last = null;

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var num = function (n) { return Number(n || 0).toLocaleString("en-IE"); };
  var when = function (iso) {
    return new Date(iso).toLocaleString("en-IE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  };
  var dayLabel = function (d) {
    return new Date(d + "T12:00:00Z").toLocaleDateString("en-IE", { day: "numeric", month: "short" });
  };
  var regions = window.Intl && Intl.DisplayNames ? new Intl.DisplayNames(["en"], { type: "region" }) : null;
  var country = function (code) { try { return (regions && code && regions.of(code)) || code || "Unknown"; } catch (e) { return code; } };
  var pageName = function (p) {
    if (p === "/") return "Home";
    var parts = p.replace(/^\/|\/$/g, "").split("/");
    var lastPart = parts[parts.length - 1].replace(/-/g, " ");
    return (parts.length > 1 ? "Projects: " : "") + lastPart.charAt(0).toUpperCase() + lastPart.slice(1);
  };
  var source = function (h) { return h ? h.replace(/^www\./, "") : "Direct or unknown"; };
  var cap = function (s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : "Unknown"; };

  function load() {
    app.setAttribute("aria-busy", "true");
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(render).withFailureHandler(function (err) {
        app.innerHTML = '<div class="error">Could not load the dashboard: ' + esc(err && err.message) + '</div>';
      }).getDashboard(days);
    } else if (window.DASHBOARD_MOCK) {
      render(window.DASHBOARD_MOCK(days));
    }
  }

  document.querySelectorAll(".range button").forEach(function (b) {
    b.addEventListener("click", function () {
      days = Number(b.getAttribute("data-days"));
      document.querySelectorAll(".range button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      load();
    });
  });

  function tile(label, value, note) {
    return '<div class="tile"><div class="label">' + esc(label) + '</div><div class="value">' + value +
      '</div><div class="note">' + (note || "&nbsp;") + '</div></div>';
  }

  function barList(title, rows, label) {
    var body;
    if (!rows || !rows.length) body = '<p class="empty">No data yet.</p>';
    else {
      var max = Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
      body = '<ul class="bars">' + rows.map(function (r) {
        var name = label(r.label);
        return '<li><span class="name" title="' + esc(r.label || name) + '">' + esc(name) + '</span><span class="num">' + num(r.value) +
          '</span><span class="track"><span class="fill" style="width:' + (r.value / max * 100).toFixed(1) + '%"></span></span></li>';
      }).join("") + '</ul>';
    }
    return '<section class="card"><h2>' + esc(title) + '</h2>' + body + '</section>';
  }

  function itemList(title, s, kind, sheetUrl) {
    var body;
    if (!s || !s.recent.length) body = '<p class="empty">Nothing yet.</p>';
    else body = '<ul class="items">' + s.recent.map(function (r) {
      var extra = kind === "involve" ? (r["Interested in"] ? '<div class="subject">Interested in: ' + esc(r["Interested in"]) + '</div>' : "")
        : '<div class="subject">' + esc(r.Subject) + '</div>';
      var contact = '<a href="mailto:' + esc(r.Email) + '">' + esc(r.Email) + '</a>' + (r.Phone ? ' · ' + esc(r.Phone) : "");
      var msg = r.Message ? '<details><summary>Read message</summary><p>' + esc(r.Message) + '</p></details>' : "";
      return '<li><div class="top"><span class="who">' + esc(r.Name) + '</span><span class="when">' + when(r.Received) + '</span></div>' +
        '<div class="meta">' + contact + '</div>' + extra + msg + '</li>';
    }).join("") + '</ul>';
    return '<section class="card"><h2>' + esc(title) + '</h2>' + body +
      (sheetUrl ? '<div class="actions"><a class="btn" href="' + esc(sheetUrl) + '" target="_blank" rel="noopener">Open the Sheet</a></div>' : "") +
      '</section>';
  }

  function newsletterCard(n, sheetUrl) {
    var list = n.recent.length ? '<ul class="items">' + n.recent.map(function (r) {
      return '<li><div class="top"><a href="mailto:' + esc(r.Email) + '">' + esc(r.Email) + '</a><span class="when">' + when(r.Received) + '</span></div></li>';
    }).join("") + '</ul>' : '<p class="empty">No sign-ups yet.</p>';
    return '<section class="card"><h2>Newsletter sign-ups</h2>' +
      '<p style="margin:0 0 12px"><strong style="color:var(--ink)">' + num(n.total) + '</strong> people on the list in total.</p>' + list +
      '<div class="actions">' + (n.total ? '<button class="btn btn-primary" type="button" id="csv">Download the list (CSV)</button>' : "") +
      (sheetUrl ? '<a class="btn" href="' + esc(sheetUrl) + '" target="_blank" rel="noopener">Open the Sheet</a>' : "") + '</div></section>';
  }

  function chart(daily) {
    var host = document.getElementById("chart");
    if (!host) return;
    var w = host.clientWidth, h = 220, padL = 32, padB = 22, padT = 8;
    var plotW = w - padL, plotH = h - padB - padT;
    var max = Math.max.apply(null, daily.map(function (d) { return d.visits; }));
    var step = max <= 4 ? 1 : Math.ceil(max / 4 / Math.pow(10, Math.floor(Math.log10(max / 4)))) * Math.pow(10, Math.floor(Math.log10(max / 4)));
    var top = Math.max(step * Math.ceil(max / step), 1);
    var gap = 2, bw = Math.max((plotW - gap * (daily.length - 1)) / daily.length, 1);
    var y = function (v) { return padT + plotH - (v / top) * plotH; };
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Visitors per day">';
    for (var v = 0; v <= top; v += (top / step > 4 ? step * 2 : step)) {
      svg += '<line class="' + (v ? "gridline" : "baseline") + '" x1="' + padL + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="axis" x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + num(v) + '</text>';
    }
    daily.forEach(function (d, i) {
      var x = padL + i * (bw + gap), top0 = y(d.visits), bh = padT + plotH - top0;
      var r = Math.min(4, bw / 2, bh);
      var path = bh > 0 ? "M" + x + "," + (padT + plotH) + "V" + (top0 + r) + "Q" + x + "," + top0 + " " + (x + r) + "," + top0 +
        "H" + (x + bw - r) + "Q" + (x + bw) + "," + top0 + " " + (x + bw) + "," + (top0 + r) + "V" + (padT + plotH) + "Z" : "";
      svg += '<rect class="hit" data-i="' + i + '" x="' + (x - gap / 2) + '" y="' + padT + '" width="' + (bw + gap) + '" height="' + plotH + '"/>' +
        (path ? '<path class="bar" data-i="' + i + '" d="' + path + '"/>' : "");
    });
    var ticks = daily.length <= 7 ? daily.map(function (_, i) { return i; }) : [0, Math.floor((daily.length - 1) / 2), daily.length - 1];
    ticks.forEach(function (i, k) {
      var anchor = daily.length <= 7 ? "middle" : (k === 0 ? "start" : k === ticks.length - 1 ? "end" : "middle");
      var x = padL + i * (bw + gap) + (anchor === "middle" ? bw / 2 : anchor === "end" ? bw : 0);
      svg += '<text class="axis" x="' + x + '" y="' + (h - 4) + '" text-anchor="' + anchor + '">' + dayLabel(daily[i].date) + '</text>';
    });
    host.innerHTML = svg + '</svg><div class="tip" id="tip"></div>';
    var tip = document.getElementById("tip");
    host.querySelectorAll(".hit").forEach(function (hit) {
      var i = Number(hit.getAttribute("data-i")), d = daily[i];
      var bar = host.querySelector('.bar[data-i="' + i + '"]');
      hit.addEventListener("mouseenter", function () {
        tip.innerHTML = '<strong>' + dayLabel(d.date) + '</strong>' + num(d.visits) + ' visitors · ' + num(d.views) + ' page views';
        tip.style.left = Math.min(Math.max(padL + i * (bw + gap) + bw / 2, 90), w - 90) + "px";
        tip.style.top = y(d.visits) + "px";
        tip.style.opacity = 1;
        if (bar) bar.classList.add("is-hover");
      });
      hit.addEventListener("mouseleave", function () { tip.style.opacity = 0; if (bar) bar.classList.remove("is-hover"); });
    });
  }

  function render(data) {
    last = data;
    app.removeAttribute("aria-busy");
    document.getElementById("who").textContent = data.user ? "Signed in as " + data.user : "";
    var v = data.visits, f = data.forms, html = "";
    var range = "in the last " + data.days + " days";
    if (data.visitsError) html += '<div class="error">Visit numbers could not be loaded: ' + esc(data.visitsError) + '</div>';
    if (data.formsError) html += '<div class="error">Form submissions could not be loaded: ' + esc(data.formsError) + '</div>';

    html += '<div class="tiles">' +
      tile("Visitors", v ? num(v.visits) : "–", range) +
      tile("Page views", v ? num(v.views) : "–", range) +
      tile("Messages", f ? num(f.messages.inRange) : "–", range) +
      tile("Get involved", f ? num(f.involve.inRange) : "–", range) +
      tile("Newsletter sign-ups", f ? num(f.newsletter.inRange) : "–", f ? num(f.newsletter.total) + " on the list in total" : "") +
      '</div>';

    if (v) {
      html += '<section class="card"><h2>Visitors per day</h2><div class="chart" id="chart"></div>' +
        '<details class="table"><summary>Show as a table</summary><table><thead><tr><th>Day</th><th>Visitors</th><th>Page views</th></tr></thead><tbody>' +
        v.daily.slice().reverse().map(function (d) { return '<tr><td>' + dayLabel(d.date) + '</td><td>' + num(d.visits) + '</td><td>' + num(d.views) + '</td></tr>'; }).join("") +
        '</tbody></table></details></section>';
      html += '<div class="grid">' +
        barList("Most viewed pages", v.pages, pageName) +
        barList("Where visitors came from", v.sources, source) + '</div>';
      html += '<div class="grid">' +
        barList("Countries", v.countries, country) +
        barList("Devices", v.devices, cap) + '</div>';
    }
    if (f) {
      html += '<div class="grid">' +
        itemList("Latest messages", f.messages, "contact", f.sheetUrl) +
        itemList("Latest get involved enquiries", f.involve, "involve", f.sheetUrl) + '</div>';
      html += newsletterCard(f.newsletter, f.sheetUrl);
    }
    app.innerHTML = html;
    if (v) chart(v.daily);

    var csv = document.getElementById("csv");
    if (csv) csv.addEventListener("click", function () {
      var lines = ["Email,Signed up"].concat(f.newsletter.all.map(function (r) {
        return '"' + String(r.Email).replace(/"/g, '""') + '",' + r.Received.slice(0, 10);
      }));
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      a.download = "hands4unity-newsletter.csv";
      document.body.appendChild(a); a.click(); a.remove();
    });

    document.getElementById("foot").textContent = "Updated " + when(data.generated) +
      ". Visit numbers come from Cloudflare Web Analytics and refresh every 10 minutes. A visitor is counted once per visit, without cookies.";
  }

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (last && last.visits) chart(last.visits.daily); }, 150);
  });

  load();
})();
</script>
</body>
</html>
